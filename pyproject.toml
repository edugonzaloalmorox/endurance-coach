[project]
name = "endurance-coach"
version = "0.1.0"
description = "A local AI cycling coach developed through an agent-driven software factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4",
    "pydantic>=2.10",
    "python-frontmatter>=1.1",
]

[project.scripts]
endurance-coach = "endurance_coach.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endurance_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "exercise: deferred executable specification owned by a linked implementation issue",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

